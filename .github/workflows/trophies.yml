# Save as .github/workflows/trophies.yml in Hadi-Alsinan/Hadi-Alsinan
#
# Uses the same METRICS_TOKEN secret as the metrics workflow. Keep that token to
# read:user at most (no public_repo / repo), so the third-party fork below can't
# change anything on your account.
#
# Why a fork? The upstream render_svg.ts on ryo-ma's master fails for every user
# (ryo-ma/github-profile-trophy PR #458 is the open fix). Once that PR is merged,
# change `repository:` back to ryo-ma/github-profile-trophy and drop `ref:`.

name: Profile trophies

on:
  schedule:
    - cron: "47 3 * * *"   # daily, 03:47 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophies:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v5

      - name: Checkout trophy generator (with the PR #458 fixes)
        uses: actions/checkout@v5
        with:
          repository: satishjhanwer/github-profile-trophy
          ref: fix/svg-generation-bugs
          path: trophy-src

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophies
        working-directory: trophy-src
        env:
          GITHUB_TOKEN1: ${{ secrets.METRICS_TOKEN }}
          GITHUB_TOKEN2: ${{ secrets.METRICS_TOKEN }}
          GITHUB_API: https://api.github.com/graphql
        run: |
          deno run --allow-net --allow-env --allow-read --allow-write ./render_svg.ts Hadi-Alsinan ../trophy-out tokyonight
          ls -la ../trophy-out

      - name: Save SVG into the profile repo
        run: |
          echo "--- what the generator produced ---"
          ls -laR trophy-out || true
          # The generator may write a file named trophy-out, or a .svg inside a folder.
          if [ -f trophy-out ]; then
            cp trophy-out github-trophies.svg
          else
            SVG=$(find trophy-out -type f | head -n 1 || true)
            test -n "$SVG" || { echo "No output file found"; exit 1; }
            cp "$SVG" github-trophies.svg
          fi
          grep -q "<svg" github-trophies.svg || { echo "Output is not an SVG:"; head -c 500 github-trophies.svg; exit 1; }
          ls -la github-trophies.svg

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-trophies.svg
          git diff --cached --quiet || git commit -m "chore: update trophies"
          git pull --rebase
          git push
